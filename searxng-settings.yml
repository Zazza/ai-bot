use_default_settings: true

general:
  instance_name: "AI Bot Search"
  debug: false

search:
  safe_search: 2
  autocomplete: ""
  default_lang: "ru"
  formats:
    - html
    - json

server:
  secret_key: "change-this-to-random-string"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: y
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
