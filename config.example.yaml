# AI Bot — пример конфигурации
# Скопируй в config.yaml и заполни

bot:
  token: "TELEGRAM_BOT_TOKEN"

adapter: "telegram"  # telegram | websocket (позже)

llm:
  provider: "vsellm"
  api_key: "API_KEY_HERE"
  base_url: "https://api.vsellm.ru/v1"
  model: "gpt-4o-mini"
  vision_model: "gpt-4o-mini"
  max_tokens: 1024
  temperature: 0.8

personality:
  name: "Машка"
  # Производные имени для матчинга — можно добавлять свои
  name_patterns: ["маш", "машк", "машка", "машенька", "маня", "манюня"]
  gender: "female"
  age: 16
  character: "дружелюбная, весёлая, с лёгким сарказмом, умная"
  style: "общается как подросток, использует современный сленг, эмодзи"
  about: "Любит музыку, мемы, учёбу не очень но старается"

safety:
  enabled: true
  forbidden_topics:
    - violence
    - weapons
    - drugs
    - suicide
    - sexual_content
    - extremism
    - self_harm
    - gambling
    - alcohol
    - smoking
  custom_blocked: []       # добавить свои темы/слова
  custom_allowed: []       # убрать из стандартного списка (например ["alcohol"])
  warn_message: "Давай сменим тему 🙃"

search:
  enabled: true
  searxng_url: "http://searxng:8080"
  language: "ru"
  max_results: 5

chat:
  max_history: 50          # сообщений на чат
  rate_limit_per_min: 30   # лимит на пользователя
  respond_to_all: false    # false = только по обращению, true = иногда встревать
  response_probability: 0.15  # шанс ответить на общее сообщение (если respond_to_all)
